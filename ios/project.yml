# ShellFrame Mobile — iOS (iPhone/iPad) + watchOS companion.
# Regenerate the Xcode project with:  xcodegen generate   (brew install xcodegen)
name: ShellFrameMobile
options:
  bundleIdPrefix: com.howard
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: 487V8X9AHS
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0

targets:
  ShellFrameMobile:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: ShellFrameMobile
      - path: Shared
    dependencies:
      - package: SwiftTerm
      - target: ShellFrameWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.howard.shellframe
        PRODUCT_NAME: ShellFrame
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: ShellFrameMobile/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShellFrameMobile/App/ShellFrameMobile.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  ShellFrameMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ShellFrameMobileUITests
    dependencies:
      - target: ShellFrameMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.howard.shellframe.uitests
        TEST_TARGET_NAME: ShellFrameMobile
        GENERATE_INFOPLIST_FILE: YES

  ShellFrameWatch:
    type: application
    platform: watchOS
    sources:
      - path: ShellFrameWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.howard.shellframe.watchkitapp
        PRODUCT_NAME: ShellFrame Watch
        INFOPLIST_FILE: ShellFrameWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.howard.shellframe
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO

schemes:
  ShellFrameMobile:
    build:
      targets:
        ShellFrameMobile: all
        ShellFrameMobileUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShellFrameMobileUITests
