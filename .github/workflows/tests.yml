# The test suite on GitHub's machines (free for a public repository): every push to main, a release branch or a
# ci/ branch, every pull request, and on demand. A developer's own run (./run_tests.sh) stays the gate for a
# release; this one catches what only shows on a clean machine, and runs what this Mac cannot (Windows).
name: tests

on:
  push:
    branches: [main, "release/**", "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (full suite)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: tmux
        run: brew install tmux
      - name: Python packages and test browsers
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt playwright
          .venv/bin/python -m playwright install chromium webkit
      - name: The app imports
        run: .venv/bin/python -c "import main"
      - name: Test suite
        run: ./run_tests.sh

  windows:
    name: Windows (imports and platform checks)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python packages
        run: python -m pip install -q -r requirements.txt
      - name: The app imports
        run: python -c "import main"
      - name: Platform checks
        env:
          SHELLFRAME_TESTS: "1"
          PYTHONIOENCODING: utf-8
        run: |
          python tests_win_esc.py
          python tests_tab_delivery.py
          python tests_codex_models.py
          python tests_win_icon.py
